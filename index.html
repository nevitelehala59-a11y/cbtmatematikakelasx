alah .....", "o": ["a = 4, b = 0, c = −9", "a = 4, b = −9, c = 0", "a = 4, b = 9, c = 0", "a = 0, b = 4, c = −9", "a = −9, b = 0, c = 4"], "k": 0}, {"q": "Bentuk persamaan (p − 1)x² + 4x − 3 = 0. Agar persamaan tersebut merupakan persamaan kuadrat dalam x, nilai p yang memenuhi adalah .....", "o": ["p = 1", "p = 0", "p > 1", "p ≠ 1", "p ≠ 0"], "k": 3}, {"q": "Sebuah desa memodelkan pembagian lahan dengan persamaan x(x − 6) = 2(x + 3). Jika persamaan tersebut dinyatakan dalam bentuk umum ax² + bx + c = 0, nilai a, b, dan c berturut-turut adalah .....", "o": ["1, −4, −6", "1, −8, 6", "1, −8, −6", "1, 8, −6", "2, −6, −3"], "k": 2}, {"q": "Dalam pelajaran Matematika, Kayla menyelesaikan persamaan kuadrat x² − 7x + 12 = 0 dengan metode faktorisasi. Ia mencari dua bilangan yang hasil kalinya 12 dan jumlahnya −7. Akar-akar persamaan tersebut adalah .....", "o": ["3 dan 4", "−3 dan −4", "3 dan −4", "−3 dan 4", "2 dan 6"], "k": 0}, {"q": "Tim Olimpiade Matematika sekolah diminta menentukan penyelesaian persamaan x² + 2x − 15 = 0 dengan faktorisasi. Himpunan penyelesaian persamaan tersebut adalah .....", "o": ["{5, −3}", "{−5, 3}", "{−5, −3}", "{3, 5}", "{−15, 1}"], "k": 1}, {"q": "Seorang pengrajin menentukan ukuran bingkai berdasarkan persamaan 2x² + 7x + 3 = 0. Dengan metode faktorisasi, akar terbesar persamaan tersebut adalah .....", "o": ["−3", "−3/2", "−1", "−1/2", "1/2"], "k": 3}, {"q": "Sebuah bola ditendang ke atas. Tinggi bola h (meter) pada detik ke-t dimodelkan oleh h(t) = 20t − 5t². Bola kembali menyentuh tanah ketika h(t) = 0, yaitu 20t − 5t² = 0. Waktu yang diperlukan bola untuk kembali ke tanah setelah ditendang (t > 0) adalah ..... detik.", "o": ["2", "4", "5", "10", "20"], "k": 1}, {"q": "Hasil kali dua bilangan asli ganjil berurutan adalah 63. Jika bilangan yang lebih kecil dinyatakan dengan n, diperoleh persamaan n(n + 2) = 63. Jumlah kedua bilangan tersebut adalah .....", "o": ["10", "12", "14", "16", "18"], "k": 3}, {"q": "Sebuah kolam ikan berbentuk per
